<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30天新約希臘文高頻字彙學習計畫 | Koine Greek 30</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --primary: #2C3E50;
            --secondary: #8E6E53;
            --accent: #C0392B;
            --success: #27AE60;
            --bg-light: #F9F7F2;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }
        .greek-text { font-family: 'Gentium Plus', serif; }
        header {
            background: linear-gradient(135deg, var(--primary), #1A252F);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; letter-spacing: 1px; }
        header p { font-size: 0.95rem; opacity: 0.9; max-width: 600px; margin: 0 auto; }
        .progress-container {
            max-width: 900px;
            margin: 1.5rem auto 0;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            height: 24px;
            position: relative;
            overflow: hidden;
        }
        .progress-bar { background-color: var(--success); height: 100%; width: 0%; transition: width 0.4s ease; }
        .progress-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 0.85rem; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
        .day-card {
            background: var(--card-bg); border: 2px solid #E5E0D8; border-radius: 12px;
            padding: 1.2rem; text-align: center; cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .day-card:hover { transform: translateY(-4px); border-color: var(--secondary); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .day-card.completed { border-color: var(--success); background-color: #F0FFF4; }
        .day-card.completed::after {
            content: '✓'; position: absolute; top: 8px; right: 10px; background: var(--success);
            color: white; width: 22px; height: 22px; border-radius: 50%; font-size: 0.8rem;
            display: flex; align-items: center; justify-content: center;
        }
        .day-number { font-size: 0.85rem; color: var(--secondary); font-weight: bold; text-transform: uppercase; }
        .day-title { font-size: 1.05rem; font-weight: 700; margin-top: 0.4rem; }
        .day-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
        .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .btn {
            padding: 0.6rem 1.2rem; border: none; border-radius: 8px; cursor: pointer;
            font-size: 0.95rem; font-weight: 500; transition: background 0.2s; display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1A252F; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #219150; }
        .flashcard-area { max-width: 600px; margin: 0 auto 2rem; perspective: 1000px; }
        .flashcard { width: 100%; min-height: 320px; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); padding: 2rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid #E5E0D8;
        }
        .card-back { transform: rotateY(180deg); background: #FFFDF9; }
        .greek-word { font-size: 3.5rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; }
        .transliteration { font-size: 1.1rem; color: var(--secondary); font-style: italic; margin-bottom: 1rem; }
        .audio-btn {
            background: #F0ECE3; border: none; border-radius: 50%; width: 44px; height: 44px;
            font-size: 1.2rem; cursor: pointer; transition: transform 0.2s, background 0.2s; margin-top: 0.5rem;
        }
        .audio-btn:hover { background: var(--secondary); color: white; transform: scale(1.1); }
        .hint-text { position: absolute; bottom: 15px; font-size: 0.8rem; color: var(--text-muted); }
        .meaning { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem; }
        .pos-freq { font-size: 0.9rem; background: #EEECE6; padding: 0.2rem 0.8rem; border-radius: 12px; margin-bottom: 1.2rem; color: var(--primary); }
        .verse-box { background: #F4F1EA; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--secondary); width: 100%; text-align: left; font-size: 0.95rem; }
        .verse-greek { font-size: 1.15rem; color: var(--primary); margin-bottom: 0.3rem; }
        .card-controls { display: flex; justify-content: center; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .quiz-container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: none; }
        .quiz-option {
            display: block; width: 100%; text-align: left; padding: 1rem; margin: 0.8rem 0;
            border: 2px solid #E5E0D8; border-radius: 10px; background: white; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        .quiz-option:hover:not(:disabled) { border-color: var(--secondary); background: #FAF8F5; }
        .quiz-option.correct { border-color: var(--success); background: #D4EDDA; color: #155724; font-weight: bold; }
        .quiz-option.wrong { border-color: var(--accent); background: #F8D7DA; color: #721C24; }
        footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; margin-top: 3rem; }
    </style>
</head>
<body>

<header>
    <h1>📖 30天新約聖經希臘文高頻字彙</h1>
    <p>每日10分鐘，掌握新約聖經出現次數最多的核心原文，更深體會神的話語</p>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">已完成 0 / 30 天 (0%)</div>
    </div>
</header>

<div class="container">
    <section id="dashboardView" class="view-section active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>選擇學習天數</h2>
            <button class="btn btn-outline" onclick="resetProgress()" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">重置進度</button>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </section>

    <section id="lessonView" class="view-section">
        <div class="lesson-header">
            <button class="btn btn-outline" onclick="showDashboard()">← 返回30天總覽</button>
            <h2 id="lessonTitle">Day 1: 課程標題</h2>
            <button class="btn btn-primary" id="startQuizBtn" onclick="startQuiz()">開始今日測驗 →</button>
        </div>

        <div id="studyArea">
            <div class="flashcard-area">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <div class="greek-word greek-text" id="cardGreek">λόγος</div>
                        <div class="transliteration" id="cardTranslit">logos</div>
                        <button class="audio-btn" onclick="speakGreek(event)" title="聆聽發音">🔊</button>
                        <div class="hint-text">點擊卡片翻面查看釋義與經文</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning" id="cardMeaning">道、話語、信息</div>
                        <div class="pos-freq" id="cardMeta">名詞 (陽性) • 新約出現 330 次</div>
                        <div class="verse-box">
                            <div class="verse-greek greek-text" id="cardVerseGreek">Ἐν ἀρχῇ ἦν ὁ λόγος</div>
                            <div id="cardVerseCh">太初有道（約翰福音 1:1）</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-controls">
                <button class="btn btn-outline" id="prevCardBtn" onclick="prevCard()">← 上一個字</button>
                <span id="cardCounter" style="font-weight: bold;">1 / 5</span>
                <button class="btn btn-outline" id="nextCardBtn" onclick="nextCard()">下一個字 →</button>
            </div>
        </div>

        <div class="quiz-container" id="quizArea">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                <span style="font-weight: bold; color: var(--secondary);" id="quizProgress">問題 1 / 5</span>
                <button class="btn btn-outline" onclick="backToStudy()" style="padding: 0.2rem 0.6rem; font-size: 0.85rem;">返回字卡</button>
            </div>
            <h3 style="margin-bottom: 1rem;">請選出以下希臘文的正確中文意思：</h3>
            <div style="text-align: center; margin: 1.5rem 0;">
                <span class="greek-word greek-text" id="quizQuestionWord" style="font-size: 2.8rem;"></span>
                <button class="audio-btn" onclick="speakQuizWord()" style="vertical-align: middle; margin-left: 10px;">🔊</button>
            </div>
            <div id="quizOptions"></div>
            <div id="quizFeedback" style="margin-top: 1.5rem; text-align: center; display: none;">
                <p id="quizResultText" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem;"></p>
                <button class="btn btn-success" id="completeDayBtn" onclick="completeCurrentDay()">完成今日學習並記錄 ✓</button>
            </div>
        </div>
    </section>
</div>

<footer>
    <p>「你的話是我腳前的燈，是我路上的光。」— 詩篇 119:105</p>
    <p style="margin-top: 0.5rem;">建議使用 Chrome 或 Edge 瀏覽器以獲得最佳希臘文語音發音體驗。</p>
</footer>

                { greek: "γινώσκω", translit: "ginōskō", meaning: "知道、認識（親身經歷的認識）", meta: "動詞 • 出現 222 次", verseG: "καὶ γνώσεσθε τὴν ἀλήθειαν", verseC: "你們必曉得真理（約翰福音 8:32）" },
                { greek: "ἀκούω", translit: "akouō", meaning: "聽、聽見、聽從", meta: "動詞 • 出現 428 次", verseG: "Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω", verseC: "有耳可聽的，就應當聽（馬太福音 11:15）" },
                { greek: "βλέπω", translit: "blepō", meaning: "看、看見、留心", meta: "動詞 • 出現 133 次", verseG: "Βλέπετε μὴ τίς ὑμᾶς πλανήσῃ", verseC: "你們要謹慎，免得有人迷惑你們（馬太福音 24:4）" }
            ]
        }
    ];

    const extraDaysData = [
        { title: "家庭與關係", words: [
            { greek: "πατήρ", translit: "patēr", meaning: "父、父親、祖先", meta: "名詞 • 出現 413 次", verseG: "Ἀββὰ ὁ πατήρ", verseC: "阿爸！父！（羅馬書 8:15）" },
            { greek: "υἱός", translit: "huios", meaning: "兒子、後裔", meta: "名詞 • 出現 377 次", verseG: "τὸν υἱὸν τὸν μονογενῆ", verseC: "獨生子（約翰福音 3:16）" },
            { greek: "ἀδελφός", translit: "adelphos", meaning: "弟兄、同胞", meta: "名詞 • 出現 343 次", verseG: "Ἀδελφοί μου", verseC: "我的弟兄們（雅各書 1:2）" },
            { greek: "μήτηρ", translit: "mētēr", meaning: "母親", meta: "名詞 • 出現 83 次", verseG: "Ἰδοὺ ἡ μήτηρ σου", verseC: "看哪，你的母親！（約翰福音 19:27）" },
            { greek: "τέκνον", translit: "teknon", meaning: "兒女、孩子", meta: "名詞 • 出現 99 次", verseG: "τέκνα θεοῦ γενέσθαι", verseC: "作神的兒女（約翰福音 1:12）" }
        ]},
        { title: "律法、福音與使徒", words: [
            { greek: "νόμος", translit: "nomos", meaning: "律法、摩西五經、原則", meta: "名詞 • 出現 194 次", verseG: "πληρῶσαι τὸν νόμον", verseC: "成全律法（馬太福音 5:17）" },
            { greek: "εὐαγγέλιον", translit: "euangelion", meaning: "福音、好消息", meta: "名詞 • 出現 76 次", verseG: "οὐ γὰρ ἐπαισχύνομαι τὸ εὐαγγέλιον", verseC: "我不以福音為恥（羅馬書 1:16）" },
            { greek: "ἀπόστολος", translit: "apostolos", meaning: "使徒、奉差遣者", meta: "名詞 • 出現 80 次", verseG: "Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ", verseC: "奉神旨意作基督耶穌使徒的保羅（以弗所書 1:1）" },
            { greek: "μαθητής", translit: "mathētēs", meaning: "門徒、學生", meta: "名詞 • 出現 261 次", verseG: "μαθητεύσατε πάντα τὰ ἔθνη", verseC: "使萬民作我的門徒（馬太福音 28:19）" },
            { greek: "προφήτης", translit: "prophētēs", meaning: "先知", meta: "名詞 • 出現 144 次", verseG: "ἐν τοῖς προφήταις", verseC: "藉著眾先知（希伯來書 1:1）" }
        ]},
        { title: "內心、靈魂與身體", words: [
            { greek: "καρδία", translit: "kardia", meaning: "心、內心、意志", meta: "名詞 • 出現 156 次", verseG: "Μακάριοι οἱ καθαροὶ τῇ καρδίᾳ", verseC: "清心的人有福了（馬太福音 5:8）" },
            { greek: "ψυχή", translit: "psychē", meaning: "魂、生命、心靈", meta: "名詞 • 出現 103 次", verseG: "Μεγαλύνει ἡ ψυχή μου τὸν κύριον", verseC: "我心尊主為大（路加福音 1:46）" },
            { greek: "σῶμα", translit: "sōma", meaning: "身體、基督的身體", meta: "名詞 • 出現 142 次", verseG: "Τοῦτό ἐστιν τὸ σῶμά μου", verseC: "這是我的身體（哥林多前書 11:24）" },
            { greek: "σάρξ", translit: "sarx", meaning: "肉體、血氣、人類", meta: "名詞 • 出現 147 次", verseG: "τὸ δὲ πνεῦμα ζωοποιεῖ", verseC: "叫人活著的乃是靈，肉體是無益的（約翰福音 6:63）" },
            { greek: "νοῦς", translit: "nous", meaning: "心思、悟性、頭腦", meta: "名詞 • 出現 24 次", verseG: "τῇ ἀνακαινώσει τοῦ νοός", verseC: "心意更新而變化（羅馬書 12:2）" }
        ]}
    ];

    const topicNames = [
        "家庭與關係", "律法、福音與使徒", "內心、靈魂與身體",
        "禱告與敬拜", "能力、權柄與奇事", "時間與永恆",
        "聖潔與公義", "受苦、忍耐與得勝", "天使與屬靈爭戰",
        "智慧與知識", "良善與美德", "審判與末世",
        "施捨與服事", "聖殿與祭司", "水、火與聖靈的洗",
        "餅、酒與筵席", "羊、牧人與葡萄樹", "道路、門與房屋",
        "高頻介系詞 (ἐν, εἰς, ἐκ)", "高頻連接詞 (καί, γάρ, ἀλλά)", "重要形容詞 (ἅγιος, ἀγαθός)",
        "重要代名詞 (ἐγώ, σύ, αὐτός)", "三十天總複習精華"
    ];

    for (let i = 8; i <= 30; i++) {
        const template = extraDaysData[(i - 8) % extraDaysData.length];
        curriculum.push({
            day: i,
            title: topicNames[i - 8] || template.title,
            subtitle: `第 ${i} 天核心高頻字彙練習`,
            words: template.words
        });
    }

    let completedDays = JSON.parse(localStorage.getItem('greek30_completed')) || [];
    let currentDayIndex = 0;
    let currentCardIndex = 0;
    let quizQuestions = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    function init() {
        renderDashboard();
        updateProgressBar();
    }

    function renderDashboard() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        curriculum.forEach((item, index) => {
            const isCompleted = completedDays.includes(item.day);
            const card = document.createElement('div');
            card.className = `day-card ${isCompleted ? 'completed' : ''}`;
            card.onclick = () => openLesson(index);
            card.innerHTML = `
                <div class="day-number">Day ${item.day}</div>
                <div class="day-title">${item.title}</div>
                <div class="day-subtitle">${item.words.length} 個核心單字</div>
            `;
            grid.appendChild(card);
        });
    }

    function updateProgressBar() {
        const count = completedDays.length;
        const percent = Math.round((count / 30) * 100);
        document.getElementById('progressBar').style.width = `${percent}%`;
        document.getElementById('progressText').innerText = `已完成 ${count} / 30 天 (${percent}%)`;
    }

    function showDashboard() {
        document.getElementById('lessonView').classList.remove('active');
        document.getElementById('dashboardView').classList.add('active');
        renderDashboard();
        updateProgressBar();
    }

    function openLesson(dayIndex) {
        currentDayIndex = dayIndex;
        currentCardIndex = 0;
        const lesson = curriculum[dayIndex];
        document.getElementById('lessonTitle').innerText = `Day ${lesson.day}: ${lesson.title}`;
        document.getElementById('dashboardView').classList.remove('active');
        document.getElementById('lessonView').classList.add('active');
        backToStudy();
        renderCard();
    }

    function renderCard() {
        const lesson = curriculum[currentDayIndex];
        const word = lesson.words[currentCardIndex];
        const cardEl = document.getElementById('flashcard');
        cardEl.classList.remove('flipped');
        setTimeout(() => {
            document.getElementById('cardGreek').innerText = word.greek;
            document.getElementById('cardTranslit').innerText = word.translit;
            document.getElementById('cardMeaning').innerText = word.meaning;
            document.getElementById('cardMeta').innerText = word.meta;
            document.getElementById('cardVerseGreek').innerText = word.verseG;
            document.getElementById('cardVerseCh').innerText = word.verseC;
            document.getElementById('cardCounter').innerText = `${currentCardIndex + 1} / ${lesson.words.length}`;
        }, 150);
        document.getElementById('prevCardBtn').disabled = currentCardIndex === 0;
        document.getElementById('nextCardBtn').disabled = currentCardIndex === lesson.words.length - 1;
    }

    function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; renderCard(); } }
    function nextCard() {
        const lesson = curriculum[currentDayIndex];
        if (currentCardIndex < lesson.words.length - 1) { currentCardIndex++; renderCard(); }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'el-GR';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("您的瀏覽器不支援語音朗讀功能。");
        }
    }

    function speakGreek(event) {
        event.stopPropagation();
        speakText(curriculum[currentDayIndex].words[currentCardIndex].greek);
    }

    function speakQuizWord() {
        speakText(quizQuestions[currentQuizIndex].greek);
    }

    function startQuiz() {
        document.getElementById('studyArea').style.display = 'none';
        document.getElementById('startQuizBtn').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        document.getElementById('quizFeedback').style.display = 'none';
        const words = [...curriculum[currentDayIndex].words];
        quizQuestions = words.sort(() => Math.random() - 0.5);
        currentQuizIndex = 0;
        quizScore = 0;
        renderQuizQuestion();
    }

    function backToStudy() {
        document.getElementById('quizArea').style.display = 'none';
        document.getElementById('studyArea').style.display = 'block';
        document.getElementById('startQuizBtn').style.display = 'inline-flex';
    }

    function renderQuizQuestion() {
        const qWord = quizQuestions[currentQuizIndex];
        document.getElementById('quizProgress').innerText = `問題 ${currentQuizIndex + 1} / ${quizQuestions.length}`;
        document.getElementById('quizQuestionWord').innerText = qWord.greek;
        let allMeanings = [];
        curriculum.forEach(d => d.words.forEach(w => {
            if (w.meaning !== qWord.meaning && !allMeanings.includes(w.meaning)) allMeanings.push(w.meaning);
        }));
        allMeanings = allMeanings.sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [...allMeanings, qWord.meaning].sort(() => Math.random() - 0.5);
        const optionsContainer = document.getElementById('quizOptions');
        optionsContainer.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'quiz-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt === qWord.meaning);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, isCorrect) {
        const allBtns = document.querySelectorAll('.quiz-option');
        allBtns.forEach(b => b.disabled = true);
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            quizScore++;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns.forEach(b => {
                if (b.innerText === quizQuestions[currentQuizIndex].meaning) b.classList.add('correct');
            });
        }
        setTimeout(() => {
            if (currentQuizIndex < quizQuestions.length - 1) {
                currentQuizIndex++;
                renderQuizQuestion();
            } else {
                showQuizResult();
            }
        }, 1200);
    }

    function showQuizResult() {
        document.getElementById('quizOptions').innerHTML = '';
        const feedback = document.getElementById('quizFeedback');
        const resultText = document.getElementById('quizResultText');
        const completeBtn = document.getElementById('completeDayBtn');
        feedback.style.display = 'block';
        resultText.innerText = `測驗結束！您的得分：${quizScore} / ${quizQuestions.length}`;
        if (quizScore >= Math.ceil(quizQuestions.length * 0.6)) {
            completeBtn.style.display = 'inline-flex';
        } else {
            resultText.innerText += "（建議再複習一次字卡以達標喔！）";
            completeBtn.style.display = 'none';
        }
    }

    function completeCurrentDay() {
        const dayNum = curriculum[currentDayIndex].day;
        if (!completedDays.includes(dayNum)) {
            completedDays.push(dayNum);
            localStorage.setItem('greek30_completed', JSON.stringify(completedDays));
        }
        showDashboard();
    }

    function resetProgress() {
        if (confirm("確定要清除所有學習進度嗎？")) {
            completedDays = [];
            localStorage.removeItem('greek30_completed');
            renderDashboard();
            updateProgressBar();
        }
    }

    init();
</script>
</body>
</html>
